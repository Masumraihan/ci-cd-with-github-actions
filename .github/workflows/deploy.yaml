name: Deploy Node.js app to VPS
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: gigdummy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/gigdummy/ci-cd-with-github-actions
            git pull
            docker compose up -d --build
